name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          {
            echo "version=$VERSION"
            echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../keystore.jks
          EOF

      - name: Build signed APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleCoreRelease assembleFdroidRelease \
            -PappVersionName=${{ steps.version.outputs.version }} \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/core/release/chatsim-core-release.apk "dist/chatsim-core-$VERSION.apk"
          cp app/build/outputs/apk/fdroid/release/chatsim-fdroid-release.apk "dist/chatsim-fdroid-$VERSION.apk"
          cd dist
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256

      - name: Compute signing fingerprint
        id: fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          OUT="$(keytool -list -v -keystore keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -J-Duser.language=en)"
          SHA256="$(echo "$OUT" | grep -i 'SHA256:' | sed 's/.*SHA256: *//' | tr -d '\r')"
          SHA1="$(echo "$OUT" | grep -i 'SHA1:' | sed 's/.*SHA1: *//' | tr -d '\r')"
          {
            echo "sha256=$SHA256"
            echo "sha1=$SHA1"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v$VERSION$" | head -n1 || true)"
          {
            echo "## 签名指纹 / Signing certificate"
            echo
            echo '```'
            echo "SHA-256: ${{ steps.fingerprint.outputs.sha256 }}"
            echo "SHA-1:   ${{ steps.fingerprint.outputs.sha1 }}"
            echo '```'
            echo
            echo "> 可用 \`apksigner verify --print-certs <apk>\` 校验；与上述一致即为本项目的正式构建。详见 [SIGNING.md](https://github.com/${{ github.repository }}/blob/main/SIGNING.md)。"
            echo
            echo "## 变更 / Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "自 \`$PREV_TAG\` 以来："
              echo
              git log --pretty='- %s (%h)' "$PREV_TAG..$GITHUB_SHA"
            else
              git log --pretty='- %s (%h)' -n 30 "$GITHUB_SHA"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.apk dist/*.sha256 \
            --title "ChatS IM v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
